<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 130 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradientPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f3fd" />
      <stop offset="100%" stop-color="#ede3fb" />
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#8a6fc1" flood-opacity="0.35"/>
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5a3d94" flood-opacity="0.3"/>
    </filter>
    <filter id="glassGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="purpleMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ab82ed" />
      <stop offset="100%" stop-color="#7649cc" />
    </linearGradient>
    <linearGradient id="progressPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1bfff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ab82ed" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <g filter="url(#buttonShadow)">
    <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#bgGradientPurple)" />
    <rect x="1" y="1" width="98" height="98" rx="24" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
  </g>

  <g filter="url(#elementShadow)">
    <rect x="42" y="16" width="16" height="6" rx="3" fill="url(#purpleMain)" />
    <rect x="46" y="22" width="8" height="4" fill="url(#purpleMain)" />
    <g transform="translate(68, 28) rotate(45)">
      <rect x="0" y="0" width="8" height="5" rx="2" fill="url(#purpleMain)" />
    </g>
    <path d="M 50 38 L 50 24 A 14 14 0 0 1 64 38 Z" fill="url(#progressPurple)" />
    <circle cx="50" cy="50" r="24" fill="#ffffff" fill-opacity="0.6" stroke="url(#purpleMain)" stroke-width="5" filter="url(#glassGlow)"/>
    <g stroke="#9b72e0" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="50" y1="29" x2="50" y2="32" />
      <line x1="71" y1="50" x2="68" y2="50" />
      <line x1="50" y1="71" x2="50" y2="68" />
      <line x1="29" y1="50" x2="32" y2="50" />
      <line x1="64.8" y1="35.2" x2="62.7" y2="37.3" />
      <line x1="64.8" y1="64.8" x2="62.7" y2="62.7" />
      <line x1="35.2" y1="64.8" x2="37.3" y2="62.7" />
      <line x1="35.2" y1="35.2" x2="37.3" y2="37.3" />
    </g>
    <line x1="50" y1="50" x2="60" y2="39" stroke="url(#purpleMain)" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="50" r="4" fill="url(#purpleMain)" />
  </g>
</svg>