<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-labelledby="title desc">
  <title id="title">Claims Hub</title>
  <desc id="desc">Anillos de inspección con clipboard check — Claims Hub, plataforma de gestión de siniestros e inspecciones.</desc>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur" opacity=".4"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity=".06"/>
    </filter>
  </defs>

  <!-- Marca -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity=".35"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity=".7" filter="url(#glow)"/>
    <g stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity=".5">
      <line x1="0" y1="-96" x2="0" y2="-78"/>
      <line x1="0" y1="78" x2="0" y2="96"/>
      <line x1="-96" y1="0" x2="-78" y2="0"/>
      <line x1="78" y1="0" x2="96" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="42" fill="url(#centerGlow)" opacity=".5"/>
    <!-- ClipboardCheck -->
    <g filter="url(#glow)">
      <rect x="-18" y="-22" width="36" height="44" rx="4" fill="url(#ringGrad)" opacity=".9"/>
      <rect x="-8" y="-26" width="16" height="8" rx="2" fill="url(#ringGrad)"/>
      <path d="M-7 0 L-2 6 L9 -6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
      <rect x="-16" y="-20" width="32" height="3" rx="1.5" fill="#FFFFFF" opacity=".25"/>
    </g>
  </g>

  <!-- Texto -->
  <text x="215" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5" filter="url(#textShadow)">Claims</text>
  <text x="215" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0284C7" letter-spacing="8">HUB</text>
  <rect x="215" y="158" width="200" height="3" rx="1.5" fill="#E2E8F0" opacity=".5"/>
  <rect x="215" y="158" width="160" height="3" rx="1.5" fill="url(#ringGrad)" opacity=".8"/>
</svg>
