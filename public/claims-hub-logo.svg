    <path d="M 50 27 C 44 27, 39 29, 35 33 C 31 37, 27 43, 27 50 C 27 58, 31 64, 36 70 C 41 75, 45 78, 50 81 C 55 78, 59 75, 64 70 C 69 64, 73 58, 73 50 C 73 43, 69 37, 65 33 C 61 29, 56 27, 50 27 Z" fill="url(#shieldBorderGrad)" />
