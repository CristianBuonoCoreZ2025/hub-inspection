      <stop offset="100%" stop-color="#7d56e6" />
    </linearGradient>
    <linearGradient id="shieldInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f0ff" />
    </linearGradient>
  </defs>

  <g filter="url(#buttonShadow)">
