<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Claims Hub">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur" opacity=".4"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Anillo exterior -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity=".35"/>

  <!-- Anillo interior -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity=".7" filter="url(#glow)"/>

  <!-- Crosshair -->
  <g stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity=".5">
    <line x1="100" y1="4" x2="100" y2="22"/>
    <line x1="100" y1="178" x2="100" y2="196"/>
    <line x1="4" y1="100" x2="22" y2="100"/>
    <line x1="178" y1="100" x2="196" y2="100"/>
  </g>

  <!-- Glow central -->
  <circle cx="100" cy="100" r="42" fill="url(#centerGlow)" opacity=".5"/>

  <!-- ClipboardCheck (icono de inspecciones) en el centro -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Clipboard base -->
    <rect x="-18" y="-22" width="36" height="44" rx="4" fill="url(#ringGrad)" opacity=".9"/>
    <!-- Clipboard top clip -->
    <rect x="-8" y="-26" width="16" height="8" rx="2" fill="url(#ringGrad)"/>
    <!-- Checkmark blanco -->
    <path d="M-7 0 L-2 6 L9 -6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <!-- Reflejo de hielo -->
    <rect x="-16" y="-20" width="32" height="3" rx="1.5" fill="#FFFFFF" opacity=".25"/>
  </g>
</svg>
