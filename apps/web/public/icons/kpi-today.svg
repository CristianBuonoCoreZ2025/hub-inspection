<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 130 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradientBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff" />
      <stop offset="100%" stop-color="#dce8fc" />
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5a8ac4" flood-opacity="0.35"/>
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a5298" flood-opacity="0.3"/>
    </filter>
    <filter id="glassGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="ringBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab6ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shieldBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80b5ff" />
      <stop offset="50%" stop-color="#4d8cfa" />
      <stop offset="100%" stop-color="#1d5ed6" />
    </linearGradient>
  </defs>

  <g filter="url(#buttonShadow)">
    <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#bgGradientBlue)" />
    <rect x="1" y="1" width="98" height="98" rx="24" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
  </g>

  <g filter="url(#elementShadow)">
    <path d="M 67 65 L 81 79" fill="none" stroke="#2d69d9" stroke-width="6" stroke-linecap="round" />
    <circle cx="82.5" cy="80.5" r="4.5" fill="#2d69d9" />
    <circle cx="50" cy="50" r="25" fill="url(#ringBlueGradient)" />
    <path d="M 26 50 A 24 24 0 0 1 50 26 A 24 24 0 0 0 26 50 Z" fill="#ffffff" opacity="0.3" />
    <g filter="url(#glassGlow)">
      <circle cx="50" cy="50" r="21" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff" stroke-width="1.5" />
    </g>
    <circle cx="50" cy="50" r="21" fill="none" stroke="#dbeafe" stroke-width="1" />
    <g>
      <path d="M 42 39 C 44 39, 48 41, 50 42 C 52 41, 56 39, 58 39 L 62 51 C 62 58, 55 64, 50 66 C 45 64, 38 58, 38 51 Z" fill="#4d8cfa" opacity="0.4" filter="url(#glassGlow)" />
      <path d="M 42 39 C 44 39, 48 41, 50 42 C 52 41, 56 39, 58 39 L 62 51 C 62 58, 55 64, 50 66 C 45 64, 38 58, 38 51 Z" fill="url(#shieldBlueGradient)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 50 42 L 50 66" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    </g>
  </g>
</svg>