<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 130 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e6" />
      <stop offset="100%" stop-color="#fbe4d1" />
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#c98a5e" flood-opacity="0.4"/>
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#a04d22" flood-opacity="0.3"/>
    </filter>
    <filter id="glassGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbc490" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
    <linearGradient id="alertGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a4c" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>

  <g filter="url(#buttonShadow)">
    <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#bgGradient)" />
    <rect x="1" y="1" width="98" height="98" rx="24" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
  </g>

  <g filter="url(#elementShadow)">
    <rect x="25" y="15" width="40" height="6" rx="3" fill="#c25e2a" />
    <rect x="25" y="79" width="40" height="6" rx="3" fill="#c25e2a" />

    <path d="M 30 21 
             C 30 40, 42 47, 45 50 
             C 42 53, 30 60, 30 79 
             L 60 79 
             C 60 60, 48 53, 45 50 
             C 48 47, 60 40, 60 21 Z" 
          fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" filter="url(#glassGlow)"/>

    <path d="M 32 38 C 37 43, 42 46, 45 50 C 48 46, 53 43, 58 38 Z" fill="url(#sandGradient)" />
    <path d="M 45 50 C 43 53, 33 60, 33 77 L 57 77 C 57 60, 47 53, 45 50 Z" fill="url(#sandGradient)" opacity="0.85"/>
    <line x1="45" y1="50" x2="45" y2="70" stroke="url(#sandGradient)" stroke-width="2" />
  </g>

  <g filter="url(#elementShadow)">
    <path d="M 75 48 L 95 82 L 55 82 Z" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 75 51 L 93 80 L 57 80 Z" fill="url(#alertGradient)" stroke="#fcdbb3" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 73.5 60 L 76.5 60 L 75.5 70 L 74.5 70 Z" fill="#ffffff" />
    <circle cx="75" cy="75" r="2.5" fill="#ffffff" />
  </g>
</svg>