<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 130 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradientBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff" />
      <stop offset="100%" stop-color="#e2ecfc" />
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5a8ac4" flood-opacity="0.35"/>
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a5298" flood-opacity="0.3"/>
    </filter>
    <filter id="glassGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fa8ff" />
      <stop offset="100%" stop-color="#2b75ed" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4da2ff" />
      <stop offset="100%" stop-color="#1b5ec4" />
    </linearGradient>
  </defs>

  <g filter="url(#buttonShadow)">
    <rect x="0" y="0" width="100" height="100" rx="25" fill="url(#bgGradientBlue)" />
    <rect x="1" y="1" width="98" height="98" rx="24" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8" />
  </g>

  <g filter="url(#elementShadow)">
    <rect x="31" y="14" width="5" height="10" rx="2.5" fill="#2b75ed" />
    <rect x="64" y="14" width="5" height="10" rx="2.5" fill="#2b75ed" />
    <rect x="22" y="20" width="56" height="56" rx="10" fill="#ffffff" fill-opacity="0.75" stroke="#ffffff" stroke-width="2" filter="url(#glassGlow)"/>
    <path d="M 22 30 A 8 8 0 0 1 30 22 L 70 22 A 8 8 0 0 1 78 30 L 78 38 L 22 38 Z" fill="url(#blueHeader)" />
    <rect x="29" y="44" width="8" height="8" rx="2" fill="#7baaf7" opacity="0.8"/>
    <rect x="41" y="44" width="8" height="8" rx="2" fill="#7baaf7" opacity="0.8"/>
    <rect x="53" y="44" width="8" height="8" rx="2" fill="#7baaf7" opacity="0.8"/>
    <rect x="65" y="44" width="8" height="8" rx="2" fill="#d0e1fd" opacity="0.8"/>
    <rect x="29" y="57" width="8" height="8" rx="2" fill="#7baaf7" opacity="0.8"/>
    <rect x="41" y="57" width="8" height="8" rx="2" fill="#7baaf7" opacity="0.8"/>
  </g>

  <g filter="url(#elementShadow)">
    <path d="M 61 45 C 50 45, 45 54, 45 61 C 45 71, 61 85, 61 85 C 61 85, 77 71, 77 61 C 77 54, 72 45, 61 45 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 61 47 C 51 47, 47 55, 47 61 C 47 69, 61 82, 61 82 C 61 82, 75 69, 75 61 C 75 55, 71 47, 61 47 Z" fill="url(#pinGradient)" stroke="#b5d3ff" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="61" cy="59" r="4.5" fill="#ffffff" />
  </g>
</svg>