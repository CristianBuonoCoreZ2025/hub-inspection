<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Claims Hub">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Anillo exterior -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="2.5" opacity=".35"/>
  <!-- Anillo interior -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#g)" stroke-width="3" opacity=".7"/>
  <!-- Crosshair -->
  <g stroke="url(#g)" stroke-width="2" stroke-linecap="round" opacity=".5">
    <line x1="50" y1="2" x2="50" y2="11"/>
    <line x1="50" y1="89" x2="50" y2="98"/>
    <line x1="2" y1="50" x2="11" y2="50"/>
    <line x1="89" y1="50" x2="98" y2="50"/>
  </g>
  <!-- ClipboardCheck en el centro -->
  <g transform="translate(50, 50)">
    <rect x="-9" y="-11" width="18" height="22" rx="2" fill="url(#g)"/>
    <rect x="-4" y="-13" width="8" height="4" rx="1" fill="url(#g)"/>
    <path d="M-3.5 0 L-1 3 L4.5 -3" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
