packages:
  - "apps/*"
  - "packages/*"

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
allowBuilds:
  bcrypt: true
  canvas: set this to true or false
  core-js: set this to true or false
  esbuild: true
  puppeteer: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
